version: '3.8'

services:
  alture-ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alture_ai_production_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-616b70a6a5msh6eee497e99ef8cap135e12jsncb8e7d0f79bc}
      - RAPIDAPI_HOST=jsearch.p.rapidapi.com
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
